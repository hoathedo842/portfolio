services:
  app:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - mongo

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '27019:27017'
    volumes:
      - ./mongo-data:/data/db
